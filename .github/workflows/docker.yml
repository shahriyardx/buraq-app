name: Docker image

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A newer push to the same branch cancels an older build still running.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache lives in the registry next to the image: uploading it to
          # the GitHub Actions cache took minutes; ghcr takes seconds.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      # Runs only after the new image is pushed. Sends Coolify the same signed
      # "push" event its GitHub webhook expects, so it deploys once the image
      # exists (a real GitHub webhook would fire before the build finishes).
      - name: Deploy on Coolify
        if: github.ref == 'refs/heads/master'
        env:
          COOLIFY_URL: http://160.25.226.233:8000/webhooks/source/github/events/manual
          SECRET: ${{ secrets.COOLIFY_GITHUB_WEBHOOK_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "::warning::COOLIFY_GITHUB_WEBHOOK_SECRET not set; skipping deploy."
            exit 0
          fi
          payload=$(jq -nc --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" \
            '{ref: "refs/heads/master", after: $sha, repository: {full_name: $repo}, commits: []}')
          sig=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$SECRET" -hex | sed 's/^.* //')
          response=$(curl --fail-with-body -sS --max-time 60 -X POST "$COOLIFY_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: sha256=$sig" \
            -d "$payload")
          echo "Coolify: $response"
